name: Build S25U CZG3 DIVA v0.6 Sensitive Lab

on:
  push:
    branches:
      - s25u-czg3-diva-v06-sensitive-lab
    paths-ignore:
      - 'lab-artifacts/**'
  workflow_dispatch:
    inputs:
      p0_fresh_page_attempts:
        description: "P0 fresh-page attempts. 1 = golden/no immediate reacquisition; >1 is user-selected lab value."
        required: true
        default: "1"
        type: string

concurrency:
  group: diva-v06-sensitive-lab
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.6 lab branch
        uses: actions/checkout@v4
        with:
          ref: s25u-czg3-diva-v06-sensitive-lab

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "ndk;29.0.14206865" || sdkmanager "ndk;28.2.13676358"
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Apply reviewed v0.6 source delta
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/diva_v06_sensitive_lab_patch.py
          grep -F 'pa3q-S938BXXSBCZG3-app-diva-v0.6-sensitive-lab' src/targets/pa3q-S938BXXSBCZG3/target.h
          grep -F 'DIVA_V06_FOPS_DELAY_USEC' src/slide_app.c
          grep -F 'DIVA_V06_QUIET_SENSITIVE_IO' src/main.c
          grep -F 'DIVA_V06_DISCARD_EXTERNAL_P0_STATE' src/preload.c
          grep -F 'post-FOPS policy=retain-confirmed' src/preload.c

      - name: Resolve experiment flags
        shell: bash
        env:
          P0_FRESH_PAGE_ATTEMPTS: ${{ inputs.p0_fresh_page_attempts || '1' }}
        run: |
          set -euxo pipefail
          case "$P0_FRESH_PAGE_ATTEMPTS" in
            ''|*[!0-9]*) echo "p0_fresh_page_attempts must be an integer" >&2; exit 2 ;;
          esac
          test "$P0_FRESH_PAGE_ATTEMPTS" -ge 1
          test "$P0_FRESH_PAGE_ATTEMPTS" -le 64
          FLAGS='-DDIVA_V06_SENSITIVE_LAB=1 -DDIVA_V06_QUIET_SENSITIVE_IO=1 -DDIVA_V06_DISCARD_EXTERNAL_P0_STATE=1 -DDIVA_V06_RETAIN_CONFIRMED_P0=1'
          if [ "$P0_FRESH_PAGE_ATTEMPTS" -gt 1 ]; then
            FLAGS="$FLAGS -DAPP_REQUIRE_FRESH_P0_SESSION=1 -DAPP_SLIDE_FRESH_PAGE_ATTEMPTS=$P0_FRESH_PAGE_ATTEMPTS -DAPP_P0_REFRESH_ORACLE_EACH_FRESH_PAGE=1"
          fi
          echo "V06_FLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "P0_FRESH_PAGE_ATTEMPTS_RESOLVED=$P0_FRESH_PAGE_ATTEMPTS" >> "$GITHUB_ENV"

      - name: Build v0.6 payload
        shell: bash
        run: |
          set -euxo pipefail
          OUT=build/pa3q-S938BXXSBCZG3
          make "$OUT/cve-2026-43499-app.so" TARGET=pa3q-S938BXXSBCZG3 TARGET_CFLAGS="$V06_FLAGS"
          P="$OUT/cve-2026-43499-app.so"
          test -f "$P"
          strings "$P" | grep -F 'pa3q-S938BXXSBCZG3-app-diva-v0.6-sensitive-lab'
          cp "$P" "$OUT/cve-2026-43499-app.FULL-DIVA-EXPERIMENTAL-v0.6.so"
          sha256sum "$OUT/cve-2026-43499-app.FULL-DIVA-EXPERIMENTAL-v0.6.so" | tee "$OUT/DIVA-v0.6-SHA256SUMS.txt"
          printf 'p0_fresh_page_attempts=%s\nflags=%s\n' "$P0_FRESH_PAGE_ATTEMPTS_RESOLVED" "$V06_FLAGS" > "$OUT/DIVA-v0.6-build-config.txt"

      - name: Upload v0.6 lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: s25u-czg3-diva-v06-sensitive-lab
          path: |
            build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.FULL-DIVA-EXPERIMENTAL-v0.6.so
            build/pa3q-S938BXXSBCZG3/DIVA-v0.6-SHA256SUMS.txt
            build/pa3q-S938BXXSBCZG3/DIVA-v0.6-build-config.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact lab payload on branch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lab-artifacts/v0.6/chunks
          cp build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.FULL-DIVA-EXPERIMENTAL-v0.6.so lab-artifacts/v0.6/
          cp build/pa3q-S938BXXSBCZG3/DIVA-v0.6-SHA256SUMS.txt lab-artifacts/v0.6/
          cp build/pa3q-S938BXXSBCZG3/DIVA-v0.6-build-config.txt lab-artifacts/v0.6/
          rm -f lab-artifacts/v0.6/chunks/part-*
          base64 -w0 build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.FULL-DIVA-EXPERIMENTAL-v0.6.so > /tmp/diva-v06.b64
          split -b 12000 -d -a 3 /tmp/diva-v06.b64 lab-artifacts/v0.6/chunks/part-
          wc -c lab-artifacts/v0.6/chunks/part-* > lab-artifacts/v0.6/chunks/SIZES.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab-artifacts/v0.6
          git commit -m 'ci: publish DIVA v0.6 sensitive-lab chunks [skip ci]'
          git push origin HEAD:s25u-czg3-diva-v06-sensitive-lab
