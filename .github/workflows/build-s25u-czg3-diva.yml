name: Build S25U CZG3 DIVA payload

on:
  push:
    branches:
      - s25u-czg3-divas-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "ndk;29.0.14206865" || sdkmanager "ndk;28.2.13676358"
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Build exact CZG3 app payload
        shell: bash
        run: |
          set -euxo pipefail
          make release TARGET=pa3q-S938BXXSBCZG3
          P=build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
          test -f "$P"
          test "$(stat -c %s "$P")" = "104128"
          sha256sum "$P" | tee build/pa3q-S938BXXSBCZG3/SHA256SUMS.txt
          strings "$P" | grep -F "pa3q-S938BXXSBCZG3-app-physical-p0-oracle"

      - name: Export matching build-tools 34 pair
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          test -f "$BT/lib64/libc++.so"
          test -f "$BT/lib/apksigner.jar"
          mkdir -p build/apk-tools-runtime/lib build/apk-tools-runtime/lib64
          cp "$BT/zipalign" build/apk-tools-runtime/zipalign
          cp "$BT/apksigner" build/apk-tools-runtime/apksigner
          cp "$BT/lib/apksigner.jar" build/apk-tools-runtime/lib/apksigner.jar
          cp "$BT/lib64/libc++.so" build/apk-tools-runtime/lib64/libc++.so
          chmod +x build/apk-tools-runtime/zipalign build/apk-tools-runtime/apksigner
          LD_LIBRARY_PATH="$BT/lib64" "$BT/zipalign" -h >/dev/null 2>&1 || true
          "$BT/apksigner" version
          sha256sum \
            build/apk-tools-runtime/zipalign \
            build/apk-tools-runtime/apksigner \
            build/apk-tools-runtime/lib/apksigner.jar \
            build/apk-tools-runtime/lib64/libc++.so \
            > build/apk-tools-runtime/SHA256SUMS.txt

      - name: Upload DIVA payload
        uses: actions/upload-artifact@v4
        with:
          name: s25u-czg3-diva-payload
          path: |
            build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
            build/pa3q-S938BXXSBCZG3/SHA256SUMS.txt
            build/apk-tools-runtime/
          if-no-files-found: error
          retention-days: 7
