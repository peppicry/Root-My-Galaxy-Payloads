name: Build S908B Sarab A-B APK

on:
  push:
    branches:
      - local-s908b-sarab-repro-1bfc3ae
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: 23adf39fcd4f1be4e73184ee960a6d5399baf147
          path: app-src

      - name: Checkout S908B source revision
        uses: actions/checkout@v4
        with:
          repository: sarabpal-dev/IonStack-S22U
          ref: 1bfc3ae56d855881d6cafdba94668db4b718279d
          path: ionstack

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and toolchains
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Build pinned S908B payload
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd ionstack
          test "$(git rev-parse HEAD)" = "1bfc3ae56d855881d6cafdba94668db4b718279d"
          make PROJECT=S908BXXSMGZB2 clean preload
          test -s build/S908BXXSMGZB2/bin/cve-2026-43499

      - name: Prepare offline assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-src/app/src/main/assets
          cp ionstack/build/S908BXXSMGZB2/bin/cve-2026-43499 \
            app-src/app/src/main/assets/s908b-sarab-1bfc3ae.so
          curl -fsSL \
            "https://raw.githubusercontent.com/peppicry/Root-My-Galaxy-Payloads/12cdaabadb5cf52181a31421c76859ba1ce54f02/kernelsu/ksud-r0s-S901BXXSNGZD7-kdp" \
            -o app-src/app/src/main/assets/ksud-r0s-S901BXXSNGZD7-kdp
          test "$(stat -c%s app-src/app/src/main/assets/ksud-r0s-S901BXXSNGZD7-kdp)" = "4621280"
          printf '%s  %s\n' \
            'fc0097be827dab2078ba23e7af223905cc8ab38c763a602982071439ae7ed962' \
            'app-src/app/src/main/assets/ksud-r0s-S901BXXSNGZD7-kdp' | sha256sum -c -
          python3 control/tools/patch_s908b_sarab_ab.py app-src

      - name: Build APK with Gradle
        working-directory: app-src
        shell: bash
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app-src/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          import zipfile
          p = 'app-src/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              info = z.getinfo('resources.arsc')
              print('resources.arsc compress_type=', info.compress_type)
              assert info.compress_type == zipfile.ZIP_STORED
          PY

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app-src/app/build/outputs/apk/debug/app-debug.apk \
            output/RootMyGalaxy-S908B-Sarab-1bfc3ae-Gradle.apk
          {
            echo 'app_source=BuSung-dev/Root-My-Galaxy@23adf39fcd4f1be4e73184ee960a6d5399baf147'
            echo 'payload_source=sarabpal-dev/IonStack-S22U@1bfc3ae56d855881d6cafdba94668db4b718279d'
            echo 'target=S908BXXSMGZB2'
            echo 'packaging=Gradle assembleDebug'
            sha256sum output/RootMyGalaxy-S908B-Sarab-1bfc3ae-Gradle.apk
            sha256sum app-src/app/src/main/assets/s908b-sarab-1bfc3ae.so
            sha256sum app-src/app/src/main/assets/ksud-r0s-S901BXXSNGZD7-kdp
          } > output/BUILD-INFO.txt
          cat output/BUILD-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-S908B-Sarab-1bfc3ae-Gradle
          path: output/*
          if-no-files-found: error
          retention-days: 3
