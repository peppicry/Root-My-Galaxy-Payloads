name: Finalize SM-S908B cleanup validation

on:
  push:
    branches:
      - port-sm-s908b-s908bxxsmgzb2
    paths:
      - ".github/workflows/finalize-sm-s908b-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Publish corrected payload and validation records
        shell: bash
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          rm -rf /tmp/finalize-bundle
          mkdir -p /tmp/finalize-bundle
          BUNDLE_SHA="e4787ba3c4499cce522492aed35156c565100469f5d3fd19cc799a7cba7211ac"
          test "$(cat .github/finalize-sm-s908b-bundle.part* | wc -c)" = "28388"
          test "$(cat .github/finalize-sm-s908b-bundle.part* | sha256sum | awk '{print $1}')" = "$BUNDLE_SHA"
          cat .github/finalize-sm-s908b-bundle.part* | base64 -d | tar -xz -C /tmp

          # Reset the target files to the reviewed PR #272 state. Some earlier
          # one-time recovery runs had already touched a subset of these files.
          git checkout 5f4b265846a5285ba5c50615359e9833b90dd6dd -- \
            src/targets/b0s-S908BXXSMGZB2/ionstack-s908b-gzb2/src/main.c \
            src/targets/b0s-S908BXXSMGZB2/README.md \
            artifacts/b0s-S908BXXSMGZB2/README.md \
            artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so \
            docs/SM-S908B-S908BXXSMGZB2.md \
            support/targets-v3.json

          # The finalizer also prepares the two permanent workflow updates so
          # it can validate their contents. Restore those files before commit:
          # GitHub's workflow token may publish normal repository files, while
          # the connected GitHub app will commit workflow files separately.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/finalize-bundle/finalize.sh')
          text = path.read_text()

          old_rm = 'rm -f .github/workflows/finalize-sm-s908b-validation.yml .github/finalize-sm-s908b-bundle.part*\n'
          if text.count(old_rm) != 1:
              raise SystemExit(f'finalizer rm anchor count={text.count(old_rm)}')
          text = text.replace(old_rm, ': # temporary publisher files are removed after the normal-file commit\n', 1)

          old_add = 'git add -A\n'
          new_add = '''git restore --source=HEAD -- \\
  .github/workflows/verify-sm-s908b-gzb2.yml \\
  .github/workflows/build-sm-s908b-preview-apk.yml

git add \\
  artifacts/b0s-S908BXXSMGZB2 \\
  docs/SM-S908B-S908BXXSMGZB2.md \\
  docs/validation/SM-S908B-S908BXXSMGZB2/2026-09-04-official-app \\
  src/targets/b0s-S908BXXSMGZB2 \\
  support/targets-v3.json
'''
          if text.count(old_add) != 1:
              raise SystemExit(f'finalizer git-add anchor count={text.count(old_add)}')
          text = text.replace(old_add, new_add, 1)
          path.write_text(text)
          PY

          chmod +x /tmp/finalize-bundle/finalize.sh
          /tmp/finalize-bundle/finalize.sh
