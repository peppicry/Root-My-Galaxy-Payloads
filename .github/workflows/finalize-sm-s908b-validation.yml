name: Finalize SM-S908B cleanup validation

on:
  push:
    branches:
      - port-sm-s908b-s908bxxsmgzb2
    paths:
      - ".github/workflows/finalize-sm-s908b-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Publish corrected payload and validation records
        shell: bash
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          rm -rf /tmp/finalize-bundle
          mkdir -p /tmp/finalize-bundle
          BUNDLE_SHA="e4787ba3c4499cce522492aed35156c565100469f5d3fd19cc799a7cba7211ac"
          test "$(cat .github/finalize-sm-s908b-bundle.part* | wc -c)" = "28388"
          test "$(cat .github/finalize-sm-s908b-bundle.part* | sha256sum | awk '{print $1}')" = "$BUNDLE_SHA"
          cat .github/finalize-sm-s908b-bundle.part* | base64 -d | tar -xz -C /tmp

          # Earlier interrupted publication attempts had already changed a few
          # target files. Reset only those files to the reviewed PR #272 state
          # so the finalizer applies its exact, fail-closed patch once.
          git checkout 5f4b265846a5285ba5c50615359e9833b90dd6dd -- \
            src/targets/b0s-S908BXXSMGZB2/ionstack-s908b-gzb2/src/main.c \
            artifacts/b0s-S908BXXSMGZB2/README.md \
            artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so \
            support/targets-v3.json

          # Remove one-time recovery workflows from the interrupted attempt.
          rm -f \
            .github/finalize-sm-s908b-bundle.ready \
            .github/workflows/publish-sm-s908b-validation-logs.yml \
            .github/workflows/rebuild-sm-s908b-cleanup-artifact.yml \
            .github/workflows/recover-sm-s908b-validation-logs.yml

          chmod +x /tmp/finalize-bundle/finalize.sh
          /tmp/finalize-bundle/finalize.sh
