name: Local S908B reproduction

on:
  push:
    branches:
      - local-s908b-sarab-repro-1bfc3ae
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact public source revision
        uses: actions/checkout@v4
        with:
          repository: sarabpal-dev/IonStack-S22U
          ref: 1bfc3ae56d855881d6cafdba94668db4b718279d
          path: ionstack

      - name: Install toolchains
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Build exact S908BXXSMGZB2 target
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euxo pipefail
          cd ionstack
          git rev-parse HEAD
          arm-linux-gnueabi-gcc --version | head -1
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version | head -1
          make PROJECT=S908BXXSMGZB2 clean preload root-helper
          mkdir -p ../out
          cp build/S908BXXSMGZB2/bin/cve-2026-43499 ../out/
          cp build/S908BXXSMGZB2/bin/cve-2026-43499-root ../out/
          cp build/S908BXXSMGZB2/bin/cve-exp32 ../out/
          {
            echo 'source_commit=1bfc3ae56d855881d6cafdba94668db4b718279d'
            echo 'project=S908BXXSMGZB2'
            echo 'ndk=28.2.13676358'
            arm-linux-gnueabi-gcc --version | head -1
            stat -c '%n %s bytes' ../out/*
            sha256sum ../out/*
            file ../out/*
          } | tee ../out/BUILD-INFO.txt

      - name: Upload local reproduction
        uses: actions/upload-artifact@v4
        with:
          name: s908b-sarab-1bfc3ae-repro
          path: out/
          if-no-files-found: error
          retention-days: 1
