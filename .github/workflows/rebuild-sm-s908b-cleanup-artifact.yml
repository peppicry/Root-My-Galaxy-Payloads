name: Rebuild SM-S908B validated artifact

on:
  push:
    branches:
      - port-sm-s908b-s908bxxsmgzb2
    paths:
      - "src/targets/b0s-S908BXXSMGZB2/**"
      - ".github/workflows/rebuild-sm-s908b-cleanup-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-sm-s908b-s908bxxsmgzb2
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r28c
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Rebuild exact validated payload
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="src/targets/b0s-S908BXXSMGZB2/ionstack-s908b-gzb2"
          OUT="$SOURCE_DIR/build/S908BXXSMGZB2/bin/cve-2026-43499"
          EXP32="$SOURCE_DIR/build/S908BXXSMGZB2/bin/cve-exp32"

          make -C "$SOURCE_DIR" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            PROJECT=S908BXXSMGZB2 API=35 API32=28 clean preload

          test "$(stat -c%s "$OUT")" = "1757752"
          printf '%s  %s\n' \
            'd2b52dc52a69571a145a64f0f57ae53884383a996661066ca84b52a45eb691bf' \
            "$OUT" | sha256sum -c -
          printf '%s  %s\n' \
            '023190461719fc4cc11a7d114ff8da5132f1afa0eba32c907053e83682914152' \
            "$EXP32" | sha256sum -c -
          strings "$OUT" | grep -F '[cleanup] resetting pipe attempt before retry'

          cp "$OUT" artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so

      - name: Update public metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("support/targets-v3.json")
          data = json.loads(path.read_text())
          matches = [p for p in data["payloads"] if p["payloadId"] == "b0s-S908BXXSMGZB2"]
          if len(matches) != 1:
              raise SystemExit(f"expected one S908B target, found {len(matches)}")
          matches[0]["exploit"]["size"] = 1757752
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          cat > artifacts/b0s-S908BXXSMGZB2/README.md <<'EOF'
          # SM-S908B / S908BXXSMGZB2 artifact

          `cve-2026-43499-app.so` is the current hardware-validated S908B/GZB2 payload for PR #272.

          | Revision | Bytes | SHA-256 |
          | --- | ---: | --- |
          | current | 1757752 | `d2b52dc52a69571a145a64f0f57ae53884383a996661066ca84b52a45eb691bf` |
          | original hardware reference | 1757688 | `19a219a94660a60c06a4c34f9a873b5c9ccacda7129d409ba8486ffe61453235` |

          The current binary adds one lifecycle/cleanup change: `reset_pipe_attempt()` is called before the CFI-fail retry `return 70`. The S908B offsets, physical KASLR scan, embedded ARM32 stage, CFI/PhysRW path, root path and KernelSU candidate are unchanged.

          The embedded ARM32 stage is still byte-identical to the original validation build:

          `023190461719fc4cc11a7d114ff8da5132f1afa0eba32c907053e83682914152`

          This rebuilt payload was tested again on physical SM-S908B/GZB2 hardware through the official Root My Galaxy execution path with a reboot between each run: **7/7 full-path successes**, with no kernel panic observed. The raw logs and run notes live under `docs/validation/SM-S908B-S908BXXSMGZB2-2026-09-04/`.

          The previous payload/hash is kept above as the original hardware reference rather than being silently replaced.
          EOF

      - name: Commit rebuilt artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so \
            artifacts/b0s-S908BXXSMGZB2/README.md \
            support/targets-v3.json
          git diff --cached --check
          git commit -m "build(s908b): publish validated retry-cleanup payload"
          git push origin HEAD:port-sm-s908b-s908bxxsmgzb2
