# Rebuild the deterministic SM-S908B GZB2 payload and check the exact
# S901B GZD7 KernelSU files used by the S908B tests.
#
# The KernelSU files are hash-checked here, not rebuilt. Runtime validation is
# covered by the device records in docs/SM-S908B-S908BXXSMGZB2.md.

name: Verify SM-S908B GZB2 payload

on:
  push:
    paths:
      - "src/targets/b0s-S908BXXSMGZB2/**"
      - "artifacts/b0s-S908BXXSMGZB2/**"
      - "kernelsu/ksud-r0s-S901BXXSNGZD7-kdp"
      - "kernelsu/android12-5.10_kernelsu-r0s-S901BXXSNGZD7-kdp.ko"
      - ".github/workflows/verify-sm-s908b-gzb2.yml"
  pull_request:
    paths:
      - "src/targets/b0s-S908BXXSMGZB2/**"
      - "artifacts/b0s-S908BXXSMGZB2/**"
      - "kernelsu/ksud-r0s-S901BXXSNGZD7-kdp"
      - "kernelsu/android12-5.10_kernelsu-r0s-S901BXXSNGZD7-kdp.ko"
      - ".github/workflows/verify-sm-s908b-gzb2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check bundled KernelSU files
        shell: bash
        run: |
          set -euo pipefail

          KSUD="kernelsu/ksud-r0s-S901BXXSNGZD7-kdp"
          KO="kernelsu/android12-5.10_kernelsu-r0s-S901BXXSNGZD7-kdp.ko"

          test "$(stat -c%s "$KSUD")" = "4621280"
          test "$(stat -c%s "$KO")" = "323168"

          printf '%s  %s\n' \
            'fc0097be827dab2078ba23e7af223905cc8ab38c763a602982071439ae7ed962' \
            "$KSUD" | sha256sum -c -
          printf '%s  %s\n' \
            '47a66801c8a1e94a757924fd30099065cea62edc80e14b83b0879cca22fef568' \
            "$KO" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Rebuild and verify payload identities
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="src/targets/b0s-S908BXXSMGZB2/ionstack-s908b-gzb2"
          PAYLOAD="$SOURCE_DIR/build/S908BXXSMGZB2/bin/cve-2026-43499"
          EXP32="$SOURCE_DIR/build/S908BXXSMGZB2/bin/cve-exp32"
          PUBLISHED_PAYLOAD="artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so"

          EXPECTED_PAYLOAD_SHA="19a219a94660a60c06a4c34f9a873b5c9ccacda7129d409ba8486ffe61453235"
          EXPECTED_EXP32_SHA="023190461719fc4cc11a7d114ff8da5132f1afa0eba32c907053e83682914152"

          make -C "$SOURCE_DIR" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            PROJECT=S908BXXSMGZB2 API=35 API32=28 clean

          make -C "$SOURCE_DIR" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            PROJECT=S908BXXSMGZB2 API=35 API32=28 preload

          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA" "$PAYLOAD" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_EXP32_SHA" "$EXP32" | sha256sum -c -

          cmp --silent "$PAYLOAD" "$PUBLISHED_PAYLOAD"

          echo "PAYLOAD_REPRODUCED=PASS"
          echo "EXP32_REPRODUCED=PASS"
          stat -c '%n %s bytes' "$PAYLOAD" "$EXP32" "$PUBLISHED_PAYLOAD"
